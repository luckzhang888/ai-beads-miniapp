name: check

on:
  push:
    branches: [main, develop, cloud-development]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm ci --prefix cloudfunctions/beads-ai
      - run: npm run verify
